openapi: 3.0.3
info:
  title: Tour Backend API
  version: 0.2.0
  description: API-first backend contract for the tour application.
servers:
  - url: http://localhost:8080/api
    description: Local backend base URL
tags:
  - name: Health
  - name: Public
  - name: Player
  - name: Admin
paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Read application health
      responses:
        '200':
          description: Application is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /editions/current:
    get:
      tags:
        - Public
      operationId: getCurrentEdition
      summary: Get active edition metadata
      responses:
        '200':
          description: Active edition details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditionSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /editions/{editionId}/riders:
    get:
      tags:
        - Public
      operationId: listRiders
      summary: List riders for an edition
      parameters:
        - $ref: '#/components/parameters/EditionId'
      responses:
        '200':
          description: Riders for the requested edition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /editions/{editionId}/standings:
    get:
      tags:
        - Public
      operationId: getStandings
      summary: Get public standings for an edition
      parameters:
        - $ref: '#/components/parameters/EditionId'
      responses:
        '200':
          description: Standings for the requested edition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingsResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /editions/{editionId}/standings/{playerId}:
    get:
      tags:
        - Public
      operationId: getPlayerStandingDetail
      summary: Get one player standing detail with stage history
      parameters:
        - $ref: '#/components/parameters/EditionId'
        - $ref: '#/components/parameters/PlayerId'
      responses:
        '200':
          description: Player standing detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStandingDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /editions/{editionId}/entries/current:
    get:
      tags:
        - Player
      operationId: getCurrentEntry
      summary: Get current player's team entry for an edition
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionId'
      responses:
        '200':
          description: Current player entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /editions/{editionId}/entries/draft:
    put:
      tags:
        - Player
      operationId: saveEntryDraft
      summary: Save or update current player's draft entry
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveEntryDraftRequest'
      responses:
        '200':
          description: Saved draft entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /editions/{editionId}/entries/submit:
    post:
      tags:
        - Player
      operationId: submitEntry
      summary: Submit current player's entry as final
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionId'
      responses:
        '200':
          description: Entry submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /editions/{editionId}/predictions/current:
    get:
      tags:
        - Player
      operationId: getCurrentPredictions
      summary: Get current player's saved classification predictions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionId'
      responses:
        '200':
          description: Current saved predictions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /editions/{editionId}/predictions:
    put:
      tags:
        - Player
      operationId: savePredictions
      summary: Save or update classification predictions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePredictionsRequest'
      responses:
        '200':
          description: Saved predictions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/editions:
    post:
      tags:
        - Admin
      operationId: createEdition
      summary: Create a new annual edition and clear edition-scoped game data
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEditionRequest'
      responses:
        '201':
          description: Edition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEditionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/players:
    post:
      tags:
        - Admin
      operationId: createPlayer
      summary: Create a player account with an initial temporary password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerRequest'
      responses:
        '201':
          description: Player created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerAdminResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/players/{playerId}/password-reset:
    post:
      tags:
        - Admin
      operationId: resetPlayerPassword
      summary: Issue a new temporary password for an existing player
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlayerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Temporary password issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/editions/{editionId}/riders/import:
    post:
      tags:
        - Admin
      operationId: importRiders
      summary: Import riders for an edition from an Excel file
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Rider import validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RiderImportLockedConflict'

  /admin/editions/{editionId}/deadline:
    patch:
      tags:
        - Admin
      operationId: updateEditionDeadline
      summary: Update entry deadline for an edition
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeadlineRequest'
      responses:
        '200':
          description: Updated deadline and lock state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadlineConfigurationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EntryReopenLockedConflict'

  /admin/editions/{editionId}/reserve-budget:
    patch:
      tags:
        - Admin
      operationId: updateReserveBudget
      summary: Update reserve budget for the active edition
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReserveBudgetRequest'
      responses:
        '200':
          description: Updated reserve budget and lock state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReserveBudgetConfigurationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReserveBudgetLockedConflict'

  /admin/editions/{editionId}/required-nationality:
    patch:
      tags:
        - Admin
      operationId: updateRequiredNationality
      summary: Update required nationality for position 11
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequiredNationalityRequest'
      responses:
        '200':
          description: Updated required nationality and lock state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequiredNationalityConfigurationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RequiredNationalityLockedConflict'

  /admin/editions/{editionId}/double-points-stages:
    patch:
      tags:
        - Admin
      operationId: updateDoublePointsStages
      summary: Update configured double-points stages
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDoublePointsStagesRequest'
      responses:
        '200':
          description: Updated double-points stages and lock state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoublePointsStagesConfigurationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/DoublePointsLockedForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/editions/{editionId}/stages/{stageNumber}/results:
    put:
      tags:
        - Admin
      operationId: saveStageResult
      summary: Save complete result data for a stage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionId'
        - $ref: '#/components/parameters/StageNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveStageResultRequest'
      responses:
        '200':
          description: Stage result saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StageSequenceConflict'
    patch:
      tags:
        - Admin
      operationId: correctStageResult
      summary: Correct the latest saved stage result
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionId'
        - $ref: '#/components/parameters/StageNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveStageResultRequest'
      responses:
        '200':
          description: Stage correction saved and recalculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageCalculationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/StageCorrectionForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/editions/{editionId}/stages/{stageNumber}/calculate:
    post:
      tags:
        - Admin
      operationId: calculateStage
      summary: Calculate scores and publish standings for a stage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionId'
        - $ref: '#/components/parameters/StageNumber'
      responses:
        '200':
          description: Stage calculation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageCalculationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StageCalculationConflict'

  /admin/editions/{editionId}/final-results:
    put:
      tags:
        - Admin
      operationId: saveFinalResults
      summary: Save final classifications and calculate final standings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveFinalResultsRequest'
      responses:
        '200':
          description: Final results saved and standings published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResultsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags:
        - Admin
      operationId: correctFinalResults
      summary: Correct final classifications and recalculate standings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EditionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveFinalResultsRequest'
      responses:
        '200':
          description: Final results corrected and standings republished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalResultsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EditionId:
      name: editionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PlayerId:
      name: playerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    StageNumber:
      name: stageNumber
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 21

  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            badRequest:
              $ref: '#/components/examples/BadRequestError'
    Unauthorized:
      description: Authentication is required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              $ref: '#/components/examples/UnauthorizedError'
    Forbidden:
      description: Authenticated but not authorized for this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              $ref: '#/components/examples/ForbiddenError'
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              $ref: '#/components/examples/NotFoundError'
    Conflict:
      description: Request conflicts with current game state or lock conditions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            conflict:
              $ref: '#/components/examples/ConflictError'
    RiderImportLockedConflict:
      description: Rider import is blocked because at least one player has already saved a team
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            locked:
              $ref: '#/components/examples/RiderImportLockedError'
    EntryReopenLockedConflict:
      description: Entry deadline cannot be reopened because stage results already exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            locked:
              $ref: '#/components/examples/EntryReopenLockedError'
    ReserveBudgetLockedConflict:
      description: Reserve budget is locked after the first team save and cannot be changed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            locked:
              $ref: '#/components/examples/ReserveBudgetLockedError'
    RequiredNationalityLockedConflict:
      description: Required nationality is locked after the first team save and cannot be changed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            locked:
              $ref: '#/components/examples/RequiredNationalityLockedError'
    DoublePointsLockedForbidden:
      description: Double-points stage configuration is locked after the entry deadline
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            locked:
              $ref: '#/components/examples/DoublePointsLockedError'
    StageSequenceConflict:
      description: Stage result cannot be saved because previous stage processing is incomplete
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            outOfSequence:
              $ref: '#/components/examples/StageSequenceConflictError'
    StageCorrectionForbidden:
      description: Only the latest saved stage can be corrected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notLatest:
              $ref: '#/components/examples/StageCorrectionForbiddenError'
    StageCalculationConflict:
      description: Stage calculation cannot run because required stage input is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            incompleteInput:
              $ref: '#/components/examples/StageCalculationConflictError'

  examples:
    BadRequestError:
      summary: Generic validation failure
      value:
        code: BAD_REQUEST
        message: Request validation failed.
        timestamp: '2026-10-01T21:15:00Z'
    UnauthorizedError:
      summary: Missing or invalid token
      value:
        code: UNAUTHORIZED
        message: Authentication is required or the token is invalid.
        timestamp: '2026-10-01T21:15:00Z'
    ForbiddenError:
      summary: Authenticated but not allowed
      value:
        code: FORBIDDEN
        message: You are not allowed to perform this operation.
        timestamp: '2026-10-01T21:15:00Z'
    NotFoundError:
      summary: Resource does not exist
      value:
        code: NOT_FOUND
        message: Requested resource was not found.
        timestamp: '2026-10-01T21:15:00Z'
    ConflictError:
      summary: Generic state conflict
      value:
        code: CONFLICT
        message: Request conflicts with the current resource state.
        timestamp: '2026-10-01T21:15:00Z'
    RiderImportLockedError:
      summary: Rider import blocked after first team save
      value:
        code: RIDER_IMPORT_LOCKED
        message: Rider import is blocked because at least one player has already saved a team.
        timestamp: '2026-10-01T21:10:00Z'
    EntryReopenLockedError:
      summary: Deadline reopening blocked after stage results
      value:
        code: ENTRY_REOPEN_LOCKED
        message: Entry deadline cannot be reopened after stage results have been saved.
        timestamp: '2026-10-01T21:10:00Z'
    ReserveBudgetLockedError:
      summary: Reserve budget change blocked
      value:
        code: RESERVE_BUDGET_LOCKED
        message: Reserve budget is locked after the first team draft has been saved.
        timestamp: '2026-10-01T21:10:00Z'
    RequiredNationalityLockedError:
      summary: Nationality change blocked
      value:
        code: REQUIRED_NATIONALITY_LOCKED
        message: Required nationality is locked after the first team draft has been saved.
        timestamp: '2026-10-01T21:10:00Z'
    DoublePointsLockedError:
      summary: Double-points stage update forbidden after deadline
      value:
        code: DOUBLE_POINTS_LOCKED
        message: Double-points stage configuration is locked after the entry deadline.
        timestamp: '2026-10-01T21:10:00Z'
    StageSequenceConflictError:
      summary: Stage save out-of-sequence
      value:
        code: STAGE_SEQUENCE_CONFLICT
        message: Stage result cannot be saved because the previous stage is not fully processed.
        timestamp: '2026-10-01T21:10:00Z'
    StageCorrectionForbiddenError:
      summary: Stage correction forbidden for non-latest stage
      value:
        code: STAGE_CORRECTION_FORBIDDEN
        message: Only the latest saved stage can be corrected.
        timestamp: '2026-10-01T21:10:00Z'
    StageCalculationConflictError:
      summary: Stage calculation blocked by incomplete input
      value:
        code: STAGE_CALCULATION_CONFLICT
        message: Stage calculation cannot run because required stage input is missing or invalid.
        timestamp: '2026-10-01T21:10:00Z'

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          example: UP
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: Validation failed
        timestamp:
          type: string
          format: date-time

    EditionSummary:
      type: object
      required:
        - editionId
        - year
        - entryDeadline
        - reserveBudget
        - requiredNationality
        - currentStage
      properties:
        editionId:
          type: integer
          format: int64
          minimum: 1
        year:
          type: integer
          minimum: 2020
        entryDeadline:
          type: string
