databaseChangeLog:
  - changeSet:
      id: 001-reset-and-seed-local-riders
      author: copilot
      changes:
        - sql:
            splitStatements: true
            stripComments: false
            sql: |
              -- Reset local sandbox data so players can start from a clean edition.
              DELETE FROM stage_history WHERE edition_id = 1;
              DELETE FROM standing WHERE edition_id = 1;
              DELETE FROM final_result WHERE edition_id = 1;
              DELETE FROM stage_result WHERE edition_id = 1;
              DELETE FROM player_prediction_version WHERE edition_id = 1;
              DELETE FROM player_entry_version WHERE edition_id = 1;
              DELETE FROM rider WHERE edition_id = 1;
              DELETE FROM edition_double_points_stage WHERE edition_id = 1;
              UPDATE edition
              SET edition_year = 2026,
                  entry_deadline = TIMESTAMPTZ '2030-07-01T20:00:00Z',
                  reserve_budget = 20,
                  required_nationality = 'FRA',
                  current_stage = 0
              WHERE id = 1;
              INSERT INTO edition_double_points_stage (edition_id, stage_number) VALUES (1, 5);
              INSERT INTO edition_double_points_stage (edition_id, stage_number) VALUES (1, 12);
