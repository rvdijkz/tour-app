databaseChangeLog:
  - changeSet:
      id: 001-create-player-account
      author: copilot
      changes:
        - createTable:
            tableName: player_account
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: display_name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: password_expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-seed-player-account
      author: copilot
      changes:
        - insert:
            tableName: player_account
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: username
                  value: player.one
              - column:
                  name: display_name
                  value: Player One
              - column:
                  name: password_hash
                  value: $2a$10$7EqJtq98hPqEX7fNZaFWoOHi6Ykz8A7kaI0s5momkGLumZ5qX6Ts.
              - column:
                  name: password_expires_at
                  valueDate: 2026-12-31T12:00:00Z
        - insert:
            tableName: player_account
            columns:
              - column:
                  name: id
                  valueNumeric: 2
              - column:
                  name: username
                  value: player.two
              - column:
                  name: display_name
                  value: Player Two
              - column:
                  name: password_hash
                  value: $2a$10$7EqJtq98hPqEX7fNZaFWoOHi6Ykz8A7kaI0s5momkGLumZ5qX6Ts.
              - column:
                  name: password_expires_at
                  valueDate: 2026-12-31T12:00:00Z

  - changeSet:
      id: 003-create-player-entry-version
      author: copilot
      changes:
        - createTable:
            tableName: player_entry_version
            columns:
              - column:
                  name: edition_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: player_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: team_name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: rider_ids
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: finisher_count_prediction
                  type: INT
              - column:
                  name: submitted_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: player_entry_version
            columnNames: edition_id, player_id, status
            constraintName: pk_player_entry_version
        - addForeignKeyConstraint:
            baseTableName: player_entry_version
            baseColumnNames: edition_id
            referencedTableName: edition
            referencedColumnNames: id
            constraintName: fk_player_entry_version_edition
        - addForeignKeyConstraint:
            baseTableName: player_entry_version
            baseColumnNames: player_id
            referencedTableName: player_account
            referencedColumnNames: id
            constraintName: fk_player_entry_version_player

  - changeSet:
      id: 004-create-player-prediction-version
      author: copilot
      changes:
        - createTable:
            tableName: player_prediction_version
            columns:
              - column:
                  name: edition_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: player_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: general_rider_ids
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: points_rider_ids
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: mountains_rider_ids
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: player_prediction_version
            columnNames: edition_id, player_id, status
            constraintName: pk_player_prediction_version
        - addForeignKeyConstraint:
            baseTableName: player_prediction_version
            baseColumnNames: edition_id
